spring.application.name=user-microservice
server.port=0

# find Eureka server at:
eureka.client.serviceUrl.defaultZone=http://localhost:8085/eureka

eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# NOTE :
# Setting the port to 0 allows the service to choose a random port at startup while setting the instance-id
# a random value allows multiple instances of this client to be registered with the Eureka server gracefully.

# MySQL Datasource Connection
spring.datasource.url=jdbc:mysql://localhost:3306/users_microservice
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

